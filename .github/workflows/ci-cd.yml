name: CI and blue-green deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: blue-green-demo:${{ github.sha }}
      - name: Validate container starts and passes health check
        run: |
          docker run -d --name api -p 8000:8000 -e APP_VERSION=${GITHUB_SHA::7} blue-green-demo:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/version | grep -F '"version":"'${GITHUB_SHA::7}'"'
          docker rm -f api

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Deploy to EC2 and validate before switching traffic
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          sudo install -m 0644 deployment/nginx/nginx.conf /etc/nginx/nginx.conf
          sudo nginx -t
          sudo systemctl reload nginx
          sudo bash deployment/blue-green/deploy-ec2.sh "$IMAGE" "$APP_VERSION"

  rollback:
    if: github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Roll back to the previous healthy slot
        run: sudo bash deployment/blue-green/rollback-ec2.sh
