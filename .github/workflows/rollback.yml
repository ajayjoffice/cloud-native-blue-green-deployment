name: Roll back blue-green deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Check the standby slot and restore traffic
        run: sudo bash deployment/blue-green/rollback-ec2.sh
